<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | University Connect MW</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #183153;
}
header {
  background: #12345a;
  color: white;
  text-align: center;
  padding: 22px;
}
header span {
  color: #50d6a5;
}
.container {
  max-width: 420px;
  margin: 50px auto;
  padding: 25px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 20px #0001;
}
h1 {
  text-align: center;
}
p {
  text-align: center;
  color: #64748b;
}
label {
  display: block;
  margin: 18px 0 7px;
  font-weight: bold;
}
input {
  width: 100%;
  padding: 13px;
  box-sizing: border-box;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 22px;
  background: #35c99b;
  color: #12345a;
  border: none;
  border-radius: 7px;
  font-size: 17px;
  font-weight: bold;
}
a {
  color: #16866c;
}
</style>
</head>

<body>

<header>
<h2>University Connect <span>MW</span></h2>
<p>Welcome back, student!</p>
</header>

<div class="container">
<h1>Student Login</h1>
<p>Enter your account details below.</p>

<form onsubmit="event.preventDefault(); alert('This is a demonstration. Secure login will be connected later.');">

<label>Email address</label>
<input type="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" placeholder="Enter your password" required>

<button type="submit">Login</button>

</form>

<p>Don't have an account?</p>
<p><a href="register.html">Join Now</a></p>
<p><a href="index.html">Return to homepage</a></p>

</div>

</body>
</html>
